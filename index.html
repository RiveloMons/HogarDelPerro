<body>
<title>Hogar Del Perro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@500&display=swap">
<style id="app-css">
/* Concepto: tienda de barrio con chapa de perro. Portada a dos columnas con un perro ilustrado sobre una pelota gigante; las tarjetas llevan el precio en una etiqueta con forma de chapa. */
:root{
  --bg:#f1f4ec; --surface:#ffffff; --tile:#e5edcd; --ink:#17231c; --muted:#56665b; --line:#d6ddcb;
  --ball:#d4e44a; --on-ball:#17231c; --collar:#c53a2d; --on-collar:#ffffff; --paper:#f6f8ef;
  --danger:#b4281d; --ok:#2f7a3d; --warn:#8a5700;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1512; --surface:#16211b; --tile:#1f2e25; --ink:#e8efe3; --muted:#9fb1a4; --line:#27382d;
    --ball:#d4e44a; --on-ball:#17231c; --collar:#ee6a5c; --on-collar:#17231c; --paper:#f6f8ef;
    --danger:#ff8a7d; --ok:#7fd18c; --warn:#f0b955; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1512; --surface:#16211b; --tile:#1f2e25; --ink:#e8efe3; --muted:#9fb1a4; --line:#27382d;
  --ball:#d4e44a; --on-ball:#17231c; --collar:#ee6a5c; --on-collar:#17231c; --paper:#f6f8ef;
  --danger:#ff8a7d; --ok:#7fd18c; --warn:#f0b955; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--collar);outline-offset:2px}
h1,h2,h3{text-wrap:balance}

.announce{background:var(--ink);color:var(--bg);font:500 13px/1.4 var(--f-mono);padding-block:8px;text-align:center}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font:800 1.25rem/1 var(--f-display);color:var(--ink);text-decoration:none;min-width:0}
.mark{width:38px;height:38px;border-radius:50%;background:var(--ball);color:var(--on-ball);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.nav{display:flex;align-items:center;gap:20px}
.nav a.nl{color:var(--ink);text-decoration:none;font-weight:500;font-size:15px}
.nav a.nl:hover{text-decoration:underline;text-underline-offset:4px}
@media (max-width:640px){.nav a.nl{display:none}}

.hero{padding-block:clamp(28px,6vw,72px)}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr}}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font:800 clamp(2.3rem,6.4vw,4.4rem)/1.02 var(--f-display);letter-spacing:-.02em;margin:.4em 0 .45em}
.lead{font-size:1.15rem;max-width:52ch;color:var(--muted);margin:0 0 1.4em;white-space:pre-line}
.hero-art svg,.hero-photo{width:100%;height:auto;max-width:460px;display:block;margin-inline:auto}
.hero-photo{aspect-ratio:1/1;object-fit:cover;border-radius:50%}

.sec{padding-block:clamp(32px,5vw,64px)}
.sec.alt{background:var(--tile)}
.sec h2{font:800 clamp(1.6rem,3.4vw,2.3rem)/1.1 var(--f-display);letter-spacing:-.01em;margin:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.count{font:500 13px var(--f-mono);color:var(--muted);margin:0}
.tools{display:grid;gap:14px;margin-block:18px 24px}
.search input{max-width:420px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:500 14px var(--f-body);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pic{aspect-ratio:4/3;background:var(--tile);display:grid;place-items:center;position:relative;max-width:100%}
.pic svg{width:56%;height:auto}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card.sold .pic{opacity:.55}
.badge{position:absolute;top:10px;left:10px;z-index:1;background:var(--ink);color:var(--bg);font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.badge.hot{background:var(--collar);color:var(--on-collar)}
.cbody{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.cat{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card h3{font:700 1.1rem/1.25 var(--f-display);margin:0}
.desc{margin:0;color:var(--muted);font-size:.93rem}
.buy{margin-top:auto;padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tag{position:relative;display:inline-flex;align-items:baseline;gap:8px;background:var(--tile);border-radius:8px 999px 999px 8px;padding:7px 14px 7px 26px;font-family:var(--f-mono)}
.tag::before{content:"";position:absolute;left:9px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--muted)}
.tag b{font-weight:500;font-size:1rem}
.tag s{color:var(--muted);font-size:.8rem}
.empty{color:var(--muted);grid-column:1/-1;margin:0}

.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:20px;margin-top:28px}
.perk{border-top:3px solid var(--ink);padding-top:12px}
.perk h3{font:700 1.1rem/1.25 var(--f-display);margin:0 0 6px}
.perk p{margin:0;color:var(--muted)}
.prose{max-width:62ch;font-size:1.08rem;margin:14px 0 0;white-space:pre-line}
.foot{border-top:1px solid var(--line);padding-block:20px;color:var(--muted);font-size:14px}
.foot-in{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.btn{font:700 15px/1.2 var(--f-body);border:2px solid var(--ink);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:transform .12s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ball{background:var(--ball);color:var(--on-ball);border-color:var(--on-ball)}
.btn-ghost{background:transparent;color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:14px}
.mini{font:600 13px var(--f-body);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.mini:disabled{opacity:.4;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px;padding:4px 0}
.cbadge{background:var(--ball);color:var(--on-ball);border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font:500 12px var(--f-mono);padding:0 6px}

input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>span{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:14px;color:var(--muted);margin:6px 0 12px}
.err{color:var(--danger);font-size:14px;margin:0 0 12px}

.drawer,.admin{position:fixed;top:0;bottom:0;right:0;background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;z-index:50;padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:-12px 0 40px rgba(0,0,0,.18)}
.drawer{width:min(420px,100%);padding-top:max(16px,env(safe-area-inset-top,0px));z-index:55}
.admin{width:min(560px,100%);padding-top:0}
@media (min-width:1000px){.admin-open #store{margin-right:560px}}
.dr-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dr-head h2,.ad-head h2{font:800 1.25rem/1.2 var(--f-display);margin:0}
.clist{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:10px}
.clist li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cname{display:grid;min-width:0}
.cname span{font:500 13px var(--f-mono);color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px;font-family:var(--f-mono)}
.total{display:flex;justify-content:space-between;font-size:1.1rem;border-top:1px solid var(--line);padding-top:12px;margin:0 0 14px}
.sel{user-select:all}

.ad-head{position:sticky;top:0;z-index:2;background:var(--surface);padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ad-actions{display:flex;gap:8px;flex-wrap:wrap}
.status{font:500 12px/1.4 var(--f-mono);margin:6px 0 0;max-width:34ch}
.status.warn{color:var(--warn)}.status.ok{color:var(--ok)}.status.err{color:var(--danger)}
.tabs{display:flex;gap:6px;margin:14px 0}
.tab{flex:1;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:9px 6px;font:600 14px var(--f-body);cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.row-between .hint{flex:1 1 200px;margin:0}
.ad-h{font:800 1rem/1.2 var(--f-display);margin:22px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.ad-h:first-child{border-top:0;padding-top:0;margin-top:4px}
.plist{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.prow{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--bg)}
.prow.is-hidden{opacity:.72}
.prow-main{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.thumb{width:48px;height:48px;border-radius:10px;background:var(--tile);overflow:hidden;display:grid;place-items:center;flex:none}
.thumb svg{width:70%;height:auto}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.big{width:84px;height:84px}
.pinfo{display:grid;min-width:0;flex:1 1 140px}
.pinfo strong{overflow-wrap:anywhere}
.pinfo span{font-size:13px;color:var(--muted)}
.pbtns{display:flex;gap:6px;margin-left:auto}
.editor{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.imgrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.imgbtns{display:flex;gap:8px;flex-wrap:wrap}
.checks{display:grid;gap:8px;margin:6px 0 14px}
.check{display:flex;gap:10px;align-items:center}
.danger{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px}
.btn-danger{background:var(--danger);border-color:var(--danger);color:var(--bg)}
.catrow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.ad-foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(10,16,12,.55);display:grid;place-items:center;z-index:60;padding:16px}
.modal-card{background:var(--surface);border-radius:18px;padding:22px;width:min(380px,100%)}
.modal-card h2{font:800 1.25rem/1.2 var(--f-display);margin:0 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.fab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:70;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

/* ---------- edición ---------- */
function setBind(path, el){
  const parts = path.split('.'), kind = parts[0], a = parts[1], b = parts[2];
  const v = el.type === 'checkbox' ? el.checked : el.value;
  if (kind === 'site') S.site[a] = v;
  else if (kind === 'perk') { if (S.perks[+a]) S.perks[+a][b] = v; }
  else if (kind === 'p') {
    const p = S.products.find(x => x.id === a); if (!p) return;
    if (b === 'price' || b === 'oldPrice') {
      const n = parseFloat(String(v).replace(',', '.'));
      p[b] = isNaN(n) ? (b === 'oldPrice' ? null : 0) : n;
    } else p[b] = v;
    const info = $('[data-pid="' + a + '"] .pinfo'); if (info) info.innerHTML = rowInfo(p);
  }
  markDirty(); renderStore();
  if (el.type === 'checkbox' || el.tagName === 'SELECT') renderAdmin();
}
function fileToDataURL(file, max, q){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const r = Math.min(1, max / Math.max(im.width, im.height));
        const c = d.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * r)); c.height = Math.max(1, Math.round(im.height * r));
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
let tt;
function toast(m){ const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 3200); }

function buildDoc(){
  const css = $('#app-css').textContent, js = $('#app-js').textContent;
  const st = JSON.stringify(S).replace(/</g, '\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' + HEAD + '<style id="app-css">' + css + '</style><div id="root"></div><script id="state" type="application/json">' + st + '<\/script><script id="app-js">' + js + '<\/script></body></html>';
}
async function publish(){
  if (publishing) return;
  publishing = true; const btn = $('#pubbtn'); if (btn) btn.disabled = true;
  statusMsg = 'Publicando…'; statusKind = ''; updateStatus();
  let art = null;
  try { art = window.claude && window.claude.use ? await window.claude.use('artifact') : null; } catch (e) { art = null; }
  if (!art) { try { localStorage.setItem('hdp-state', JSON.stringify(S)); dirty = false; statusMsg = 'Guardado en este navegador.'; statusKind = 'ok'; } catch (e) { statusMsg = 'No se pudo guardar: el navegador bloquea el almacenamiento.'; statusKind = 'err'; } publishing = false; renderAdmin(); return; }
  try {
    try { sessionStorage.setItem('hdp-just', '1'); } catch (e) {}
    await art.publish(buildDoc());
  } catch (e) {
    try { sessionStorage.removeItem('hdp-just'); } catch (e2) {}
    const c = e && e.code;
    statusMsg = c === 'conflict' ? 'Alguien publicó antes que tú. La página se recargará con la última versión.'
      : (c === 'not_writer' || c === 'not_granted' || c === 'consent_required') ? 'Solo el propietario de la página puede guardar los cambios.'
      : c === 'too_large' ? 'La página es demasiado grande. Sube imágenes más pequeñas o quita alguna.'
      : c === 'rate_limited' ? 'Demasiados guardados seguidos. Espera un momento y vuelve a intentarlo.'
      : 'No se pudo publicar. Inténtalo de nuevo.';
    statusKind = 'err';
  }
  publishing = false; renderAdmin();
}

function move(id, dir){
  const i = S.products.findIndex(p => p.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= S.products.length) return;
  const t = S.products[i]; S.products[i] = S.products[j]; S.products[j] = t;
  markDirty(); renderStore(); renderAdmin();
}
root.addEventListener('click', async e => {
  const t = e.target.closest('[data-act],[data-go],[data-chip],[data-add],[data-tab]');
  if (!t) return;
  const ds = t.dataset, a = ds.act, id = ds.id;
  if (ds.go) { e.preventDefault(); const n = d.getElementById(ds.go); if (n) n.scrollIntoView({behavior: 'smooth'}); return; }
  if (ds.chip !== undefined) { view.cat = ds.chip; renderCatalog(); return; }
  if (ds.add) { addToCart(ds.add); return; }
  if (ds.tab) { tab = ds.tab; renderAdmin(); return; }
  switch (a) {
    case 'open-cart': renderCart(); $('#cart').hidden = false; break;
    case 'close-cart': $('#cart').hidden = true; break;
    case 'inc': cart[id] = (cart[id] || 0) + 1; saveCart(); renderCart(); break;
    case 'dec': cart[id] = (cart[id] || 0) - 1; if (cart[id] <= 0) delete cart[id]; saveCart(); renderCart(); break;
    case 'clear-cart': cart = {}; saveCart(); renderCart(); break;
    case 'copy-order': {
      const ta = $('#orderText');
      try { await navigator.clipboard.writeText(ta.value); toast('Pedido copiado'); }
      catch (err) { ta.focus(); ta.select(); toast('Selecciona el texto y cópialo'); }
      break;
    }
    case 'admin-entry':
      if (admin) setPanel(true);
      else { $('#login').hidden = false; $('#loginErr').hidden = true; $('#pw').value = ''; setTimeout(() => $('#pw').focus(), 30); }
      break;
    case 'close-login': $('#login').hidden = true; break;
    case 'open-panel': setPanel(true); break;
    case 'close-panel': setPanel(false); break;
    case 'logout':
      admin = false; try { sessionStorage.removeItem('hdp-admin'); sessionStorage.removeItem('hdp-panel'); } catch (err) {}
      panelOpen = false; renderAdmin(); renderFab();
      toast(dirty ? 'Sesión cerrada. Los cambios sin publicar se perderán al recargar.' : 'Sesión cerrada');
      break;
    case 'publish': publish(); break;
    case 'add-product': {
      const nid = 'p' + Date.now().toString(36);
      S.products.unshift({id: nid, name: 'Nuevo producto', price: 0, oldPrice: null, cat: S.cats[0] || '', desc: '', icon: 'hueso', img: '', visible: true, soldOut: false});
      editId = nid; delAsk = null; tab = 'productos'; markDirty(); renderStore(); renderAdmin();
      const inp = $('[data-bind="p.' + nid + '.name"]'); if (inp) { inp.focus(); inp.select(); }
      break;
    }
    case 'edit': editId = editId === id ? null : id; delAsk = null; renderAdmin(); break;
    case 'up': move(id, -1); break;
    case 'down': move(id, 1); break;
    case 'rm-img': { const p = S.products.find(x => x.id === id); if (p) { p.img = ''; markDirty(); renderStore(); renderAdmin(); } break; }
    case 'rm-hero': S.site.heroImg = ''; markDirty(); renderStore(); renderAdmin(); break;
    case 'del-ask': delAsk = id; renderAdmin(); break;
    case 'del-no': delAsk = null; renderAdmin(); break;
    case 'del-yes':
      S.products = S.products.filter(p => p.id !== id); delete cart[id]; saveCart(); renderCart();
      editId = null; delAsk = null; markDirty(); renderStore(); renderAdmin(); toast('Producto eliminado'); break;
    case 'cat-add': {
      const inp = $('#newcat'), v = inp.value.trim();
      if (!v) { toast('Escribe el nombre de la categoría'); break; }
      if (S.cats.indexOf(v) >= 0) { toast('Esa categoría ya existe'); break; }
      S.cats.push(v); markDirty(); renderStore(); renderAdmin(); break;
    }
    case 'cat-del': S.cats.splice(+ds.i, 1); markDirty(); renderStore(); renderAdmin(); break;
    case 'pass': {
      const v = $('#newpass').value;
      if (!v) { toast('Escribe la nueva contraseña'); break; }
      S.adminPass = v; markDirty(); $('#newpass').value = ''; toast('Contraseña cambiada. Publica para guardarla.'); break;
    }
  }
});
root.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.bind) setBind(t.dataset.bind, t);
  else if (t.id === 'q') { view.q = t.value; renderCatalog(); }
});
root.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset && t.dataset.catidx !== undefined) {
    const i = +t.dataset.catidx, old = S.cats[i], nv = t.value.trim();
    if (!nv || (S.cats.indexOf(nv) >= 0 && nv !== old)) { t.value = old; toast('Nombre vacío o repetido'); return; }
    S.cats[i] = nv; S.products.forEach(p => { if (p.cat === old) p.cat = nv; });
    markDirty(); renderStore(); renderAdmin(); return;
  }
  if (t.dataset && t.dataset.file && t.files && t.files[0]) {
    const path = t.dataset.file;
    try {
      const url = await fileToDataURL(t.files[0], path === 'hero' ? 1400 : 900, 0.82);
      if (path === 'hero') S.site.heroImg = url;
      else { const p = S.products.find(x => x.id === path.slice(2)); if (p) p.img = url; }
      markDirty(); renderStore(); renderAdmin();
    } catch (err) { toast('No se pudo leer la imagen. Prueba con otra.'); }
  }
});
root.addEventListener('submit', e => {
  if (e.target.id !== 'loginForm') return;
  e.preventDefault();
  if ($('#pw').value === String(S.adminPass == null ? '123' : S.adminPass)) {
    admin = true; try { sessionStorage.setItem('hdp-admin', '1'); } catch (err) {}
    $('#login').hidden = true; setPanel(true); toast('Bienvenido al panel');
  } else { $('#loginErr').hidden = false; $('#pw').select(); }
});
d.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#login').hidden) $('#login').hidden = true;
  else if (!$('#cart').hidden) $('#cart').hidden = true;
});

/* ---------- arranque ---------- */
root.innerHTML = '<div id="store"></div><aside id="cart" class="drawer" aria-label="Tu pedido" hidden></aside><aside id="admin" class="admin" aria-label="Panel de administración" hidden></aside>' +
  '<div id="login" class="modal" hidden><form id="loginForm" class="modal-card"><h2>Acceso de administrador</h2><label class="field"><span>Contraseña</span><input id="pw" type="password" autocomplete="current-password"></label><p id="loginErr" class="err" hidden>Contraseña incorrecta.</p><div class="row"><button class="btn btn-ball" type="submit">Entrar</button><button type="button" class="btn btn-ghost" data-act="close-login">Cancelar</button></div></form></div>' +
  '<button id="fab" class="btn btn-ball fab" data-act="open-panel" hidden>Panel de administración</button><div id="toast" class="toast" role="status"></div>';
renderStore(); renderCart(); renderAdmin(); renderFab();
try { if (sessionStorage.getItem('hdp-just') === '1') { sessionStorage.removeItem('hdp-just'); toast('Cambios publicados. Ya los ven tus clientes.'); } } catch (e) {}
})();
</script>

</body>
</html>
